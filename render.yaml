services:
  - type: web
    name: crypqrshare
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn crypqrshare.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: crypqrshare.settings
      - key: PYTHON_VERSION
        value: 3.10
